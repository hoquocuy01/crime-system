<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danh sách tội phạm</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#e2e8f0;font-family:Segoe UI,Arial,sans-serif}header{padding:22px max(18px,calc((100% - 1180px)/2));background:#111c33;border-bottom:1px solid #334155;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}h1{font-size:clamp(21px,3vw,30px);color:#38bdf8;margin:0}a{color:#7dd3fc}.wrap{max-width:1180px;margin:26px auto;padding:0 18px}.intro{color:#cbd5e1;line-height:1.7}.tools{display:flex;gap:12px;margin:20px 0;flex-wrap:wrap}.tools input{flex:1;min-width:220px;padding:12px;border-radius:8px;border:1px solid #475569;background:#1e293b;color:white}.count{color:#94a3b8;margin:8px 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.person{background:#1e293b;border:1px solid #334155;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}.person img{width:100%;height:230px;object-fit:cover;background:#334155}.person-body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}.person h2{font-size:19px;margin:0;color:#f8fafc}.muted{color:#94a3b8;font-size:14px}.tag{color:#fecaca;background:#7f1d1d;padding:4px 8px;border-radius:5px;display:inline-block;font-size:12px;width:max-content}.btn{border:0;border-radius:7px;padding:10px 13px;cursor:pointer;font-weight:600;background:#0284c7;color:white}.btn:hover{background:#0369a1}.detail{display:none;position:fixed;inset:0;background:#020617d9;z-index:10;padding:20px;overflow:auto;align-items:center;justify-content:center}.dialog{max-width:700px;width:100%;background:#1e293b;border:1px solid #475569;border-radius:12px;padding:22px}.detail-grid{display:grid;grid-template-columns:170px 1fr;gap:20px}.detail-grid img{width:160px;height:190px;object-fit:cover;border-radius:8px}.field{margin:8px 0;line-height:1.6}.field b{color:#7dd3fc}.warning{margin-top:15px;padding:12px;background:#0f172a;border-left:3px solid #ef4444;color:#cbd5e1;line-height:1.6}@media(max-width:520px){.detail-grid{grid-template-columns:1fr}.detail-grid img{width:130px;height:155px}}
</style></head>
<body>
<header><h1>📚 Danh sách hồ sơ tội phạm</h1><a href="/">Về trang chủ</a></header>
<main class="wrap"><p class="intro">Trang tra cứu danh sách hồ sơ tội phạm đã được nhập vào hệ thống, bao gồm mọi trạng thái. Trang hiển thị thông tin hồ sơ phục vụ tra cứu; số CCCD/CMND và dữ liệu định danh nhạy cảm không được công khai.</p>
<div class="tools"><input id="search" placeholder="Tìm theo họ tên, biệt danh, tội danh, quê quán, trạng thái..." autocomplete="off"><button class="btn" onclick="loadWanted()">Tải lại</button></div><div class="count" id="count">Đang tải dữ liệu...</div><div class="grid" id="cards"></div></main>
<div class="detail" id="detail" onclick="if(event.target===this)closeDetail()"><div class="dialog"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><h2 style="margin-top:0;color:#38bdf8">Chi tiết hồ sơ tội phạm</h2><button class="btn" onclick="closeDetail()">Đóng</button></div><div id="detailContent"></div></div></div>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img=v=>typeof v==='string'&&(/^https?:\/\//i.test(v)||/^\/uploads\/[a-f0-9]{32}\.(jpg|png|webp)$/i.test(v))?v:'https://via.placeholder.com/300x230?text=No+Photo';
const danger={low:'Thấp',medium:'Trung bình',high:'Cao',extremely_dangerous:'Đặc biệt nguy hiểm'};const statuses={wanted:'Đang truy nã',under_investigation:'Đang xác minh / điều tra',detained:'Đã tạm giữ',arrested:'Đã bắt giữ',prosecuted:'Đã khởi tố',awaiting_trial:'Chờ xét xử',convicted:'Đã kết án',serving_sentence:'Đang chấp hành án',released:'Đã được trả tự do',acquitted:'Được tuyên vô tội',case_suspended:'Tạm đình chỉ vụ án',case_closed:'Đã kết thúc xử lý',deceased:'Đã chết'};let records=[];
function render(){const q=document.getElementById('search').value.trim().toLocaleLowerCase('vi');const list=records.filter(x=>[x.full_name,x.alias,x.crime_type,x.pob,x.identifying_marks,x.status,statuses[x.status]].some(v=>String(v||'').toLocaleLowerCase('vi').includes(q)));document.getElementById('count').textContent=`Có ${list.length} hồ sơ phù hợp`;const root=document.getElementById('cards');if(!list.length){root.innerHTML='<p>Không có hồ sơ phù hợp hoặc hệ thống chưa có hồ sơ.</p>';return}root.innerHTML=list.map(x=>`<article class="person"><img src="${esc(img(x.avatar_url))}" alt="Ảnh ${esc(x.full_name)}" onerror="this.onerror=null;this.src='https://via.placeholder.com/300x230?text=No+Photo'"><div class="person-body"><h2>${esc(x.full_name||'Chưa cập nhật')}</h2><div class="muted">Biệt danh: ${esc(x.alias||'Không có')}</div><div><span class="tag">${esc(statuses[x.status]||x.status||'Chưa cập nhật')}</span></div><div><b>Tội danh:</b> ${esc(x.crime_type||'Chưa cập nhật')}</div><div><b>Mức độ:</b> ${esc(danger[x.danger_level]||x.danger_level||'Chưa xác định')}</div><button class="btn" onclick="showDetail(${Number(x.id)})">Xem đầy đủ thông tin công khai</button></div></article>`).join('')}
function showDetail(id){const x=records.find(v=>Number(v.id)===id);if(!x)return;document.getElementById('detailContent').innerHTML=`<div class="detail-grid"><div><img src="${esc(img(x.avatar_url))}" alt="Ảnh đối tượng" onerror="this.onerror=null;this.src='https://via.placeholder.com/160x190?text=No+Photo'"><div class="tag" style="margin-top:10px">${esc(statuses[x.status]||x.status||'Chưa cập nhật')}</div></div><div><h3 style="margin:0 0 12px;color:#f8fafc">${esc(x.full_name||'Chưa cập nhật')}</h3><div class="field"><b>Mã hồ sơ:</b> #${esc(x.id)}</div><div class="field"><b>Biệt danh:</b> ${esc(x.alias||'Không có')}</div><div class="field"><b>Ngày sinh:</b> ${esc(x.dob?new Date(x.dob).toLocaleDateString('vi-VN'):'Chưa cập nhật')}</div><div class="field"><b>Quê quán / nơi sinh:</b> ${esc(x.pob||'Chưa cập nhật')}</div><div class="field"><b>Tội danh:</b> ${esc(x.crime_type||'Chưa cập nhật')}</div><div class="field"><b>Đặc điểm nhận dạng:</b> ${esc(x.identifying_marks||'Chưa cập nhật')}</div><div class="field"><b>Trạng thái hồ sơ:</b> ${esc(statuses[x.status]||x.status||'Chưa cập nhật')}</div><div class="field"><b>Mức độ nguy hiểm:</b> ${esc(danger[x.danger_level]||x.danger_level||'Chưa xác định')}</div><div class="warning">Nếu phát hiện hoặc có thông tin liên quan, hãy liên hệ cơ quan công an gần nhất. Không tự ý tiếp cận đối tượng.</div></div></div>`;document.getElementById('detail').style.display='flex'}
function closeDetail(){document.getElementById('detail').style.display='none'}
async function loadWanted(){const count=document.getElementById('count');count.textContent='Đang tải dữ liệu...';try{const r=await fetch('/api/public/crimes');if(!r.ok)throw new Error('Máy chủ không trả về dữ liệu.');records=await r.json();render()}catch(e){count.textContent='Không tải được danh sách. Hãy kiểm tra máy chủ và thử lại.';document.getElementById('cards').innerHTML=''}}
document.getElementById('search').addEventListener('input',render);loadWanted();
</script></body></html>
